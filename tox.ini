[tox]
envlist =
    py{312,313}-django{52,60}-{base,pdf,mfa,axes,vcr,otel,health_checks,cli,yubin,logging}
    py312-django52-logging-otel
    ruff
    docs
    typecheck
skip_missing_interpreters = true

[gh-actions]
python =
    3.12: py312
    3.13: py313

[gh-actions:env]
DJANGO =
    5.2: django52
    6.0: django60

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE=testapp.settings
    PYTHONPATH={toxinidir}
    base: TESTS=tests/base tests/drf_spectacular
    pdf: TESTS=tests/pdf
    mfa: TESTS=tests/mfa
    axes: TESTS=tests/axes
    vcr: TESTS=tests/vcr
    otel: TESTS=tests/otel
    health_checks: TESTS=tests/health_checks
    cli: TESTS=tests/cli
    yubin: TESTS=tests/yubin
    logging: TESTS=tests/logging
passenv =
    PGHOST
    PGPORT
    PGDATABASE
    PGUSER
    PGPASSWORD
extras =
    tests
    pdf: pdf
    mfa: mfa
    axes: axes
    vcr: vcr
    otel: otel
    health_checks: health-checks
    cli: cli
    yubin: yubin
    logging: structlog
deps =
  django52: Django~=5.2.0
  django60: Django~=6.0.0
  health_checks: celery
  cli: celery
  logging: celery
skipsdist = True
commands_pre =
    python -m django compilemessages --verbosity 0 --ignore ".tox/*"
commands =
    pytest {env:TESTS} \
    -m 'not e2e' \
    --cov --cov-report xml:reports/coverage-{envname}.xml \
    {posargs}

[testenv:e2e]
setenv =
    DJANGO_SETTINGS_MODULE=testapp.settings
    PYTHONPATH={toxinidir}
extras =
    tests
deps =
    Django~=5.2.0
commands_pre =
    python -m django compilemessages --verbosity 0 --ignore ".tox/*"
commands =
    pytest tests -m 'e2e' \
    --ignore tests/cli \
    --ignore tests/health_checks \
    --ignore tests/logging \
    --ignore tests/otel \
    --ignore tests/pdf \
    --ignore tests/vcr \
    --ignore tests/yubin \
    --cov --cov-report xml:reports/coverage-{envname}.xml \
    {posargs}

[testenv:py312-django52-logging-otel]
setenv =
    DJANGO_SETTINGS_MODULE=testapp.settings
    PYTHONPATH={toxinidir}
passenv =
    PGHOST
    PGPORT
    PGDATABASE
    PGUSER
    PGPASSWORD
extras =
    tests
    structlog
    otel
deps =
  Django~=5.2.0
  celery
skipsdist = True
commands_pre =
    python -m django compilemessages --verbosity 0 --ignore ".tox/*"
commands =
    pytest tests/logging/ \
    -m 'not e2e' \
    --cov --cov-report xml:reports/coverage-{envname}.xml \
    {posargs}

[testenv:ruff]
extras = tests
skipsdist = True
commands_pre =
commands =
    ruff check --output-format=github .
    ruff format --check

[testenv:docs]
basepython=python
changedir=docs
skipsdist=true
extras =
    tests
    docs
    health-checks
    yubin
    structlog
allowlist_externals = make
deps =
    celery
commands_pre =
commands=
    make SPHINXOPTS="-W" html
    make linkcheck

[testenv:typecheck]
basepython=python
skipsdist=true
extras =
    tests
    pdf
    mfa
    axes
    vcr
    otel
    health-checks
    cli
    structlog
    yubin
deps =
    celery
commands_pre =
commands = pyright
